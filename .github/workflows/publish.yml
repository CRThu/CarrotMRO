name: Publish to NPM

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run Unit Tests
        run: bun run test

      - name: Build Project
        run: bun run build

      - name: Publish to NPM
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "使用 NPM_TOKEN 凭证发布..."
            npm config set //registry.npmjs.org/:_authToken ${{ secrets.NPM_TOKEN }}
            npm publish --access public
          else
            echo "使用 GitHub OIDC 免密凭据发布..."
            rm -f ~/.npmrc /home/runner/work/_temp/.npmrc
            npm publish --access public --provenance
          fi
