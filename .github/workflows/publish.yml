name: Publish Package

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: npm install -g npm@latest
      - name: Publish to NPM
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "检测到预发布 Tag (${{ github.ref_name }})，使用 --tag alpha 发布..."
            npm publish --access public --tag alpha
          else
            echo "检测到正式 Release Tag (${{ github.ref_name }})，发布到 latest 稳定频道..."
            npm publish --access public
          fi
